[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kbqa"
version = "0.1.0"
description = "企业知识问答 Agent（小影校招作业第 3 题）"
requires-python = ">=3.10"

[project.scripts]
kbqa = "kbqa.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning:jieba.*", "ignore::DeprecationWarning"]
